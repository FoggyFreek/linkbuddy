sonar.projectKey=FoggyFreek_linkbuddy
sonar.organization=foggyfreek

sonar.sources=server,src,shared
# Tests execute from their co-located __tests__ folders and contribute to the
# LCOV reports below, but Sonar does not analyze the test files themselves.
sonar.exclusions=**/__tests__/**/*,dist/**,coverage/**,coverage-browser/**
sonar.coverage.exclusions=**/__tests__/**/*

# Both suites report separately; Sonar merges the two lcov files.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-browser/lcov.info
