<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Band link page" />
    <title>Band Links</title>
    <link rel="icon" type="image/png" href="./shared/icons/gb_whiteback_128.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'light';
          var dark = localStorage.getItem('mui-color-scheme-dark') || 'dark';
          var light = localStorage.getItem('mui-color-scheme-light') || 'light';
          var colorScheme = '';
          if (mode === 'system') {
            colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? dark : light;
          } else if (mode === 'dark') {
            colorScheme = dark;
          } else if (mode === 'light') {
            colorScheme = light;
          }
          if (colorScheme) {
            document.documentElement.dataset.theme = colorScheme;
          }
        } catch (e) {
          // Storage blocked: fall through to the ThemeProvider's default mode.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
