<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Band link page" />
    <title>Band Links</title>
    <!--
      Colour-scheme init, the CSR equivalent of MUI's <InitColorSchemeScript>.
      That component only emits its script during server rendering (it returns
      null on the client), so for this Vite CSR app the same inline script is
      placed here to run before the bundle. It restores the operator's stored
      mode onto <html data-theme> before first paint, preventing the editor from
      flashing light on load. Keys/attribute match the theme: useColorScheme
      stores the mode under `mui-mode`; the theme's colorSchemeSelector is
      `[data-theme='%s']`, so the attribute written here is `data-theme`;
      defaultMode ("light") matches the ThemeProvider.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'light';
          var dark = localStorage.getItem('mui-color-scheme-dark') || 'dark';
          var light = localStorage.getItem('mui-color-scheme-light') || 'light';
          var colorScheme = '';
          if (mode === 'system') {
            colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? dark : light;
          } else if (mode === 'dark') {
            colorScheme = dark;
          } else if (mode === 'light') {
            colorScheme = light;
          }
          if (colorScheme) {
            document.documentElement.setAttribute('data-theme', colorScheme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
